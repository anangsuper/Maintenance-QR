# ==============================================================================
# Konfigurasi Nginx Produksi - Bank Mitra QR Maintenance System
# Path Server: /etc/nginx/sites-available/maintenance-qr
# Target: Ubuntu 24.04 LTS / PHP 8.3-FPM
# ==============================================================================

# 1. Server HTTP Port 80 (Akses LAN IP & Redirect Domain Resmi ke HTTPS)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/adminmitra/Maintenance-QR/api;
    index index.php index.html;

    client_max_body_size 64M;

    # Hilangkan ekstensi .php dari URL browser untuk estetika & keramahan URL
    if ($request_uri ~* "^(.+)\.php(\?.*)?$") {
        return 301 $1$2;
    }

    location / {
        # Cek file asli, jika folder cek index, atau coba akhiran .php
        try_files $uri $uri/ $uri.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 120s;
    }

    # Caching aset statis (CSS, JS, Gambar, WebP, SVG)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
    }
}

# 2. Server HTTPS Port 443 (Domain Resmi dengan Sertifikat SSL Let's Encrypt)
server {
    server_name it.bankmitra.co.id;

    root /home/adminmitra/Maintenance-QR/api;
    index index.php index.html;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ $uri.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 120s;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
    }

    # Konfigurasi SSL Let's Encrypt (Certbot)
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/it.bankmitra.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it.bankmitra.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# 3. Redirect otomatis HTTP ke HTTPS khusus domain resmi
server {
    if ($host = it.bankmitra.co.id) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name it.bankmitra.co.id;
    return 404;
}
